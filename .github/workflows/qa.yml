---
name: QA

on:
    pull_request:
    push:
        branches:
            - main

defaults:
    run:
        shell: bash

permissions:
    contents: read

env:
    # symfony-tools/recipes-checker main commit of 2026-11-11 (bump together with flex-update.yml)
    RECIPES_CHECKER_REF: d4f10e22ac3378a4001c6bd336e1ec65a82ccd7d

jobs:
    structure:
        name: Recipe structure
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Validate layout and manifests
              run: |
                  status=0

                  # Every directory at depth 3 must be <vendor>/<package>/<major.minor> and hold a manifest.json.
                  while IFS= read -r dir; do
                      dir="${dir#./}"
                      if [[ ! "$(basename "$dir")" =~ ^[0-9]+\.[0-9]+$ ]]; then
                          echo "::error file=$dir::Recipe version directory must be <major>.<minor>"
                          status=1
                      fi
                      if [[ ! -f "$dir/manifest.json" ]]; then
                          echo "::error file=$dir::Missing manifest.json"
                          status=1
                      fi
                  done < <(find . -mindepth 3 -maxdepth 3 -type d -not -path './.*')

                  # Package directories must not contain anything but version directories.
                  while IFS= read -r file; do
                      echo "::error file=${file#./}::Unexpected file outside a <vendor>/<package>/<version> directory"
                      status=1
                  done < <(find . -mindepth 2 -maxdepth 3 -type f -not -path './.*')

                  # Every manifest.json must be a JSON object.
                  while IFS= read -r manifest; do
                      manifest="${manifest#./}"
                      if ! jq -e 'type == "object"' "$manifest" > /dev/null; then
                          echo "::error file=$manifest::manifest.json is not a valid JSON object"
                          status=1
                      fi
                  done < <(find . -mindepth 4 -maxdepth 4 -name manifest.json -not -path './.*')

                  exit $status

    lint:
        name: recipes-checker lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install recipes-checker
              run: |
                  git clone --quiet https://github.com/symfony-tools/recipes-checker.git .github/recipes-checker
                  git -C .github/recipes-checker checkout --quiet "$RECIPES_CHECKER_REF"
                  composer install --no-dev --no-progress --working-dir=.github/recipes-checker

            - name: Lint manifests
              run: php .github/recipes-checker/run lint:manifests --contrib

            - name: Lint YAML files
              run: |
                  files=$(find * -name '*.yaml' -or -name '*.yml')
                  if [[ -n "$files" ]]; then
                      echo "$files" | php .github/recipes-checker/run lint:yaml
                  fi
